services:
  # 企业网站管理系统 (前台+后台一体化)
  cms:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: enterprise-cms
    ports:
      - "8081:80"
    volumes:
      # 持久化数据库
      - cms-data:/var/www/html/runtime
      # 持久化上传文件
      - cms-uploads:/var/www/html/public/uploads
    environment:
      - APP_DEBUG=false
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  cms-data:
    driver: local
  cms-uploads:
    driver: local

networks:
  default:
    name: cms-network
